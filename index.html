<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ДР-Аркада Ленчика</title>
    <meta name="description" content="Пиксельная мини-аркада ко дню рождения Ленчика.">
    <meta property="og:title" content="ДР-Аркада Ленчика">
    <meta property="og:description" content="Набор коротких пиксельных игр для Ленчика.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="kicker">8-BIT PARTY</p>
          <h1>ДР-Аркада Ленчика</h1>
        </div>
        <div class="scorebox">
          <span>общий счет</span>
          <strong id="totalScore">0</strong>
        </div>
      </header>

      <section class="cabinet" aria-label="Игровой автомат">
        <aside class="menu">
          <div class="menu-head">
            <span>игры</span>
            <button id="randomBtn" type="button">случайная</button>
          </div>
          <nav id="gameMenu" class="game-menu" aria-label="Выбор игры"></nav>
        </aside>

        <section class="stage-wrap">
          <div class="stage-head">
            <div>
              <p id="gameKind" class="kicker">READY</p>
              <h2 id="gameTitle">Выбери игру</h2>
            </div>
            <div id="hud" class="hud"></div>
          </div>

          <div class="canvas-frame">
            <canvas id="gameCanvas" width="960" height="540" aria-label="Игровой экран"></canvas>
            <div id="overlay" class="overlay"></div>
          </div>

          <div class="controls">
            <button id="startBtn" type="button">старт</button>
            <button id="restartBtn" type="button">заново</button>
            <button id="menuBtn" type="button">меню</button>
          </div>
        </section>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
